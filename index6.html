    <main>
       <main>
    <form action="" id="contact-form">
        
       
        <div class="form__item">
            <label for="topic">Тема</label><br>
            <select name="topic" id="topic" required>
                <option value="1">Заказать услугу</option>
                <option value="2">Оставить отзыв/замечание</option>
                <option value="3">Предложить сотрудничество</option>
                <option value="4">Другое</option>
            </select>
        </div>

      
        <div class="form__item">
            <label for="name">Имя</label><br>
          
            <input type="text" name="name" id="name" placeholder="Ваше имя" required>
        </div>

        <div class="form__item">
            <label for="email">E-mail</label><br>
            
            <input type="email" name="email" id="email" placeholder="example@mail.ru" required pattern="@">
        </div>

        <div class="form__item">
            <label for="message">Текст сообщения</label><br>
            <textarea name="message" id="message" rows="5" placeholder="Введите ваше сообщение..." required></textarea>
        </div>
        
        <div class="form__item">
            <input type="submit" value="Отправить">
        </div>

    </form>
